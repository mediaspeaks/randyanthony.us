<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RANDI | Live Stream</title>

<meta name="description"
      content="Listen live to RANDI — Randy Anthony Network And Digital Interface. Selections from Randy Anthony's personal music collection.">

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #0b1020;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
    }

    .page {
        width: 100%;
        max-width: 760px;
        padding: 28px 18px 50px;
    }

    .brand {
        text-align: center;
        margin-bottom: 26px;
    }

    .brand h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 48px);
        letter-spacing: 3px;
    }

    .brand-name {
        margin-top: 8px;
        color: #b8c0d8;
        font-size: 14px;
        line-height: 1.5;
    }

    .live {
        display: inline-block;
        margin-top: 14px;
        padding: 6px 12px;
        border: 1px solid #53df8c;
        border-radius: 20px;
        color: #53df8c;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .card {
        background: #151c32;
        border: 1px solid #28324e;
        border-radius: 18px;
        padding: 22px;
        margin-bottom: 18px;
    }

    .section-label {
        color: #8994b2;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1.5px;
        margin-bottom: 9px;
    }

    #title {
        font-size: clamp(24px, 6vw, 34px);
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: 8px;
    }

    #artist {
        font-size: 20px;
        color: #cdd5ea;
        margin-bottom: 12px;
    }

    .details {
        color: #8994b2;
        font-size: 14px;
        min-height: 18px;
    }

    .player {
        overflow: hidden;
        padding: 0;
    }

    .player iframe {
        display: block;
        width: 100%;
        height: 80px;
        border: 0;
    }

    .collection {
        text-align: center;
        color: #8994b2;
        font-size: 13px;
        line-height: 1.6;
        margin-top: 24px;
    }

    .status {
        margin-top: 14px;
        font-size: 11px;
        color: #66708d;
    }

    @media (max-width: 500px) {
        .page {
            padding: 22px 12px 40px;
        }

        .card {
            padding: 18px;
            border-radius: 14px;
        }
    }
</style>
</head>

<body>

<main class="page">

    <header class="brand">
        <h1>RANDI</h1>

        <div class="brand-name">
            Randy Anthony Network And Digital Interface
        </div>

        <div class="live">● LIVE</div>
    </header>


    <section class="card">

        <div class="section-label">
            NOW PLAYING
        </div>

        <div id="title">
            Loading current selection…
        </div>

        <div id="artist"></div>

        <div class="details" id="details"></div>

        <div class="status" id="metadata-status"></div>

    </section>

<section class="card player">

    <iframe
      src="https://embed.clrd.net/player/019fbfc4-bfc8-7d40-8f89-fbccd77eefdf"
      width="100%"
      height="80"
      frameborder="0"
      allow="autoplay; encrypted-media"
      title="RANDI Radio Player">
    </iframe>

</section>


    <div class="collection">
        Broadcasting selections from Randy Anthony's personal music collection.
        <br>
        RANDI | Randy Anthony Network And Digital Interface
    </div>

</main>


<script>

const METADATA_URL =
    "https://randi-metadata.mediaspeaks.workers.dev/nowplaying";


async function updateNowPlaying() {

    const titleElement =
        document.getElementById("title");

    const artistElement =
        document.getElementById("artist");

    const detailsElement =
        document.getElementById("details");

    const statusElement =
        document.getElementById("metadata-status");


    try {

        const response = await fetch(
            METADATA_URL + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {
            throw new Error(
                "Metadata service returned " +
                response.status
            );
        }


        const track = await response.json();


        titleElement.textContent =
            track.title ||
            "Another Personal Collection Selection";


        artistElement.textContent =
            track.artist || "RANDI";


        let details = [];


        if (track.album) {
            details.push(track.album);
        }


        if (track.year) {
            details.push(track.year);
        }


        detailsElement.textContent =
            details.join(" • ");


        if (track.updated) {

            const updated =
                new Date(track.updated);

            statusElement.textContent =
                "Metadata updated " +
                updated.toLocaleTimeString();

        } else {

            statusElement.textContent =
                "";

        }


    } catch (error) {

        titleElement.textContent =
            "Another Personal Collection Selection";

        artistElement.textContent =
            "RANDI";

        detailsElement.textContent =
            "";

        statusElement.textContent =
            "Live metadata temporarily unavailable";

        console.error(
            "RANDI metadata error:",
            error
        );

    }

}


/* Initial metadata load */

updateNowPlaying();


/*
    Poll every 5 seconds.

    This DOES NOT reload the page
    and DOES NOT interrupt the audio player.
*/

setInterval(
    updateNowPlaying,
    5000
);

</script>

</body>
</html>
