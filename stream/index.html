<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RANDI | Randy Anthony Network And Digital Interface</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        background: #080b12;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
    }

    .randi {
        width: 100%;
        max-width: 760px;
    }

    .header {
        text-align: center;
        margin-bottom: 34px;
    }

    .logo {
        font-size: clamp(48px, 10vw, 82px);
        font-weight: 800;
        letter-spacing: 8px;
        margin: 0;
    }

    .full-name {
        margin-top: 8px;
        color: #aeb5c2;
        font-size: 14px;
        letter-spacing: 1.2px;
    }

    .live {
        display: inline-block;
        margin-top: 18px;
        padding: 6px 12px;
        border: 1px solid #ff4050;
        border-radius: 20px;
        color: #ff6471;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .now-playing {
        background: #111722;
        border: 1px solid #222b3a;
        border-radius: 14px;
        padding: 28px;
        margin-bottom: 20px;
        text-align: center;
    }

    .label {
        color: #808b9c;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 3px;
        margin-bottom: 20px;
    }

    #title {
        font-size: clamp(25px, 6vw, 38px);
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: 9px;
    }

    #artist {
        font-size: 20px;
        color: #c8ced8;
        margin-bottom: 9px;
    }

    #album {
        font-size: 14px;
        color: #778395;
    }

    .player {
        background: #111722;
        border: 1px solid #222b3a;
        border-radius: 14px;
        padding: 16px;
        overflow: hidden;
    }

    .player iframe {
        display: block;
        width: 100%;
        height: 80px;
        border: 0;
    }

    .footer {
        text-align: center;
        margin-top: 25px;
        color: #626d7d;
        font-size: 11px;
        letter-spacing: 1px;
    }

    .status-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #ff4050;
        border-radius: 50%;
        margin-right: 7px;
    }

    @media (max-width: 600px) {
        body {
            padding: 15px;
            align-items: flex-start;
        }

        .randi {
            margin-top: 25px;
        }

        .header {
            margin-bottom: 24px;
        }

        .now-playing {
            padding: 24px 16px;
        }

        .player {
            padding: 10px;
        }
    }
</style>
</head>

<body>

<main class="randi">

    <header class="header">
        <h1 class="logo">RANDI</h1>

        <div class="full-name">
            Randy Anthony Network And Digital Interface
        </div>

        <div class="live">
            <span class="status-dot"></span>LIVE
        </div>
    </header>


    <section class="now-playing">

        <div class="label">NOW PLAYING</div>

        <div id="title">
            Another Personal Collection Selection
        </div>

        <div id="artist">
            RANDI
        </div>

        <div id="album">
            Live from the Personal Collection
        </div>

    </section>


    <section class="player">

        <iframe
            src="https://embed.clrd.net/player/019fbfc4-bfc8-7d40-8f89-fbccd77eedfd"
            allow="autoplay; encrypted-media"
            title="RANDI Live Player">
        </iframe>

    </section>


    <footer class="footer">
        RANDI &nbsp;|&nbsp; Randy Anthony Network And Digital Interface
    </footer>

</main>


<script>

/*
========================================================
RANDI NOW PLAYING
========================================================

RANDI Helper will eventually publish:

{
    "artist": "Steely Dan",
    "title": "Deacon Blues",
    "album": "Aja",
    "year": "1977"
}

Change METADATA_URL below to the final RANDI Helper
metadata endpoint when we build it.

========================================================
*/

const METADATA_URL = "/randi/nowplaying.json";


async function updateNowPlaying() {

    try {

        const response = await fetch(
            METADATA_URL + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            return;
        }

        const track = await response.json();

        if (track.title) {
            document.getElementById("title").textContent =
                track.title;
        }

        if (track.artist) {
            document.getElementById("artist").textContent =
                track.artist;
        }

        let albumLine = "";

        if (track.album) {
            albumLine = track.album;
        }

        if (track.year) {

            if (albumLine) {
                albumLine += " • ";
            }

            albumLine += track.year;
        }

        if (albumLine) {
            document.getElementById("album").textContent =
                albumLine;
        }

    }

    catch (error) {

        /*
        RANDI keeps the existing display if metadata
        temporarily cannot be reached.
        */

    }

}


/* Get metadata immediately */

updateNowPlaying();


/* Check iTunes metadata every five seconds */

setInterval(updateNowPlaying, 5000);

</script>

</body>
</html>
