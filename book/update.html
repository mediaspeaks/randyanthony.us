<style>

/* ==========================================================
ROOT
========================================================== */

:root{

--bg:#f6f7fb;

--surface:#ffffff;

--text:#142033;

--muted:#5b6778;

--border:#dce3ed;

--blue:#163d7a;

--blue2:#214f97;

--green:#0d7357;

--radius:18px;

--shadow:0 18px 42px rgba(0,0,0,.12);

--max:1120px;

}

/* ==========================================================
RESET
========================================================== */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:

"Segoe UI",

Helvetica,

Arial,

sans-serif;

background:var(--bg);

color:var(--text);

line-height:1.7;

overflow-x:hidden;

}

img{

display:block;

max-width:100%;

height:auto;

}

a{

text-decoration:none;

color:inherit;

}

.wrap{

max-width:var(--max);

margin:auto;

padding:0 24px;

}

/* ==========================================================
BUTTONS
========================================================== */

.btn{

display:inline-flex;

align-items:center;

justify-content:center;

padding:13px 24px;

border-radius:12px;

font-weight:600;

background:var(--blue);

color:#fff;

transition:.25s;

}

.btn:hover{

background:var(--blue2);

transform:translateY(-2px);

}

.btn.secondary{

background:white;

border:1px solid var(--border);

color:var(--text);

}

.btn.secondary:hover{

background:#eef3fb;

}

/* ==========================================================
HEADER
========================================================== */

.site-header{

position:sticky;

top:0;

z-index:1000;

background:rgba(255,255,255,.94);

backdrop-filter:blur(10px);

border-bottom:1px solid rgba(20,32,51,.08);

}

.header-inner{

max-width:1320px;

margin:auto;

padding:14px 28px;

display:flex;

align-items:center;

justify-content:space-between;

gap:24px;

}

.brand{

display:flex;

align-items:center;

gap:14px;

flex-shrink:0;

}

.brand img{

width:46px;

height:46px;

border-radius:10px;

}

.titles strong{

display:block;

font-size:14px;

letter-spacing:.6px;

font-weight:700;

}

.titles span{

display:block;

margin-top:2px;

font-size:12px;

color:var(--muted);

}

.primary-nav{

display:flex;

align-items:center;

gap:14px;

margin-left:auto;

}

.primary-nav a{

padding:8px 12px;

border-radius:10px;

font-size:14px;

font-weight:500;

color:var(--muted);

transition:.25s;

}

.primary-nav a:hover{

background:#edf2f8;

color:var(--text);

}

.primary-nav .btn{

margin-left:10px;

color:#fff;

}

.mobile-toggle{

display:none;

background:none;

border:none;

font-size:30px;

cursor:pointer;

}

.mobile-nav{

display:none;

position:absolute;

top:72px;

right:24px;

min-width:250px;

background:#fff;

border:1px solid var(--border);

border-radius:16px;

box-shadow:var(--shadow);

padding:14px;

z-index:2000;

}

.mobile-nav.show{

display:block;

}

.mobile-nav a{

display:block;

padding:12px;

border-radius:8px;

}

.mobile-nav a:hover{

background:#edf2f8;

}

/* ==========================================================
HERO
========================================================== */

.hero{

margin:42px auto 72px;

max-width:1320px;

border-radius:28px;

overflow:hidden;

background:

linear-gradient(
135deg,
rgba(10,27,55,.95),
rgba(22,61,122,.88)
),

url("/series/assets/ops-architecture-bg.jpg")

center center / cover;

box-shadow:0 24px 60px rgba(0,0,0,.18);

}

.hero-inner{

display:grid;

grid-template-columns:1fr 1.15fr;

gap:42px;

align-items:center;

padding:60px;

}

.hero-copy h1{

font-size:clamp(2.5rem,4vw,3.5rem);

color:#fff;

margin-bottom:24px;

}

.hero-copy p{

font-size:20px;

line-height:1.85;

color:rgba(255,255,255,.90);

margin-bottom:36px;

max-width:580px;

}

.hero-buttons{

display:flex;

gap:18px;

flex-wrap:wrap;

}

.hero-image{

width:100%;

max-width:560px;

margin-left:auto;

border-radius:18px;

box-shadow:0 30px 60px rgba(0,0,0,.35);

}

/* ==========================================================
PUBLISHED WORKS GRID
========================================================== */

.books-grid{

max-width:1400px;

margin:0 auto 80px;

padding:0 24px;

display:grid;

grid-template-columns:repeat(3,1fr);

gap:32px;

}

.book-card{

background:#fff;

border-radius:20px;

padding:28px;

border:1px solid var(--border);

box-shadow:var(--shadow);

display:flex;

flex-direction:column;

height:100%;

}

.book-card img{

width:220px;

margin:0 auto 22px;

border-radius:14px;

box-shadow:var(--shadow);

}

.book-card h2{

font-size:24px;

text-align:center;

margin-bottom:12px;

}

.book-card h4{

font-size:15px;

text-align:center;

color:var(--green);

margin-bottom:20px;

text-transform:uppercase;

letter-spacing:.08em;

}

.book-card p{

color:var(--muted);

font-size:16px;

margin-bottom:20px;

flex:1;

line-height:1.8;

}

.book-buttons{

display:flex;

flex-direction:column;

gap:12px;

margin-top:auto;

}

class="books-grid"
