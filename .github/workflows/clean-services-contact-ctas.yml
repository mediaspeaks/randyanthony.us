name: Clean Services Contact CTAs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-consultation contact CTAs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('home.html')
          s = p.read_text(encoding='utf-8')
          old = ''' <a class="btn" style="border-color: var(--border); background: var(--surface2);" href="/book">Book</a>\n\n           <a class="btn" style="border-color: var(--border); background: var(--surface2);" href="/radio">Radio</a>\n              <a class="btn" style="border-color: var(--border); background: var(--surface2);" href="mailto:inbox@randyanthony.us?subject=Consultation%20request%20-%20Operational%20Reliability">Request a Consultation</a>'''
          new = '''              <a class="btn" style="border-color: var(--border); background: var(--surface2);" href="mailto:inbox@randyanthony.us?subject=Consultation%20request%20-%20Operational%20Reliability">Request a Consultation</a>'''
          if old not in s:
              raise SystemExit('Expected contact CTA block was not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Clean Services contact CTAs"
          git push
