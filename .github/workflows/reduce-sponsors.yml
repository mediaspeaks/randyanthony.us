name: Reduce sponsor card repetition

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-unwanted-sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove sponsor grids from selected pages
        shell: python
        run: |
          import re
          from pathlib import Path

          targets = [
              "book/fm.html",
              "book/newbook.html",
              "book/points.html",
              "book/ella.html",
              "series/week-01-reliability.html",
              "series/week-02-invisible-work.html",
              "series/week-03-composure.html",
              "series/week-04-dependencies.html",
              "series/week-06-missing-content.html",
              "series/week-07-redundancy.html",
              "series/week-08-small-errors.html",
              "series/week-09-fatigue.html",
              "series/week-11-accountability.html",
              "series/week-12-prevention.html",
              "series/week-13-architecture.html",
              "series/week-14-part-1-wrap-up.html",
              "series/week-16-illusion-of-visibility.html",
              "series/week17-hidden-dependencies.html",
              "series/week18-escalation-paths.html",
              "series/week19-compressed-decision-windows.html",
              "series/week20-operational-drift.html",
              "series/week21-false-recovery.html",
              "series/week22-control-surface-vs-system-state.html",
              "series/week23-signal-prioritization.html",
              "series/week24-interface-fragility.html",
              "series/week26-decision-load-under-pressure.html",
              "series/week27-operational-visibility-synthesis.html",
          ]

          pattern = re.compile(
              r'\n?\s*<div class="sponsor-grid"[^>]*>.*?</div>',
              re.DOTALL
          )

          changed = []
          for name in targets:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              new_text, count = pattern.subn("\n", text, count=1)
              if count:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(name)

          print("Changed:")
          for name in changed:
              print(name)

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/fm.html book/newbook.html book/points.html book/ella.html series/
          if git diff --cached --quiet; then
            echo "No sponsor changes required."
            exit 0
          fi
          git commit -m "Reduce repeated sponsor cards across site content"
          git push
