name: Finalize sponsor cards

on:
  push:
    branches:
      - sponsor-canonical-migration-3

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize sponsor cards
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          mint = '''<article class="sponsor-card">
              <img class="sponsor-logo" src="/assets/mint-mobile-referral.webp" alt="Mint Mobile">
              <h3>Sponsored by Mint Mobile</h3>
              <p>Switch to Mint Mobile and stop overpaying for wireless service. <br> <br>If you're tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need.<br> <br>Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.</p>
              <a class="sponsor-cta" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a>
            </article>'''

          legal = '''<article class="sponsor-card">
              <img class="sponsor-logo" src="/assets/LegalShield_logo.png" alt="LegalShield">
              <h3>SPONSORED BY: Legal Shield</h3>
              <p>Legal Shield &amp; ID Shield<br>
              Protecting Families &amp; Businesses Nationwide.</p>
              <a class="sponsor-cta" href="/legal/">Explore Plans →</a>
            </article>'''

          grid = '<div class="sponsor-grid">\n\n            ' + legal + '\n\n            ' + mint + '\n\n          </div>'
          changed = []

          for path in sorted(Path('series').glob('week*.html')):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'<div class="sponsor-grid"[\s\S]*?</div>', text)
              if not match:
                  continue
              old = match.group(0)
              if 'Piety Paychain' not in old and 'sponsor-card' in old and 'Mint Mobile' in old:
                  continue
              new = text[:match.start()] + grid + text[match.end():]
              path.write_text(new, encoding='utf-8')
              changed.append(str(path))

          book = Path('book/index.html')
          text = book.read_text(encoding='utf-8')
          def book_card(m):
              b = m.group(0)
              if 'Mint Mobile' in b:
                  return '<article class="info-card sponsor-card">\n              <img class="sponsor-logo" src="/assets/mint-mobile-referral.webp" alt="Mint Mobile">\n              <h3>Sponsored by Mint Mobile</h3>\n              <p>Switch to Mint Mobile and stop overpaying for wireless service. <br> <br>If you\'re tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need.<br> <br>Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.</p>\n              <a class="sponsor-cta" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a>\n            </article>'
              if 'Sponsored by LegalShield' in b:
                  return '<article class="info-card sponsor-card">\n              <img class="sponsor-logo" src="/assets/LegalShield_logo.png" alt="LegalShield">\n              <h3>Sponsored by LegalShield</h3>\n              <p>Life is unpredictable. Legal questions aren\'t.</p>\n              <p>Whether you\'re protecting your family, growing a business, buying a home, reviewing a contract, or planning for the future, LegalShield provides affordable access to experienced attorneys without the uncertainty of expensive hourly legal fees.</p>\n              <p>Members receive legal consultation, document review, identity theft protection, and ongoing legal support designed to help individuals, families, entrepreneurs, and small businesses make confident decisions before problems become costly.</p>\n              <a class="sponsor-cta" href="/legal/">Explore LegalShield</a>\n            </article>'
              return b
          new, count = re.subn(r'<article class="info-card">[\s\S]*?</article>', book_card, text)
          if count and new != text:
              book.write_text(new, encoding='utf-8')
              changed.append('book/index.html')

          services = Path('services.html')
          text = services.read_text(encoding='utf-8')
          def service_card(m):
              b = m.group(0)
              if 'Mint Mobile' in b:
                  return '<article class="sponsor-card">\n              <img class="sponsor-logo" src="/assets/mint-mobile-referral.webp" alt="Mint Mobile">\n              <h3>Sponsored by Mint Mobile</h3>\n              <p>Switch to Mint Mobile and stop overpaying for wireless service. <br> <br>If you\'re tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need.<br> <br>Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.</p>\n              <a class="sponsor-cta" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a>\n            </article>'
              return '<article class="sponsor-card">\n              <img class="sponsor-logo" src="/assets/LegalShield_logo.png" alt="LegalShield">\n              <h3>Sponsored by LegalShield</h3>\n              <p>Life is unpredictable. Legal questions aren\'t.</p>\n              <p>Whether you\'re protecting your family, growing a business, buying a home, reviewing a contract, or planning for the future, LegalShield provides affordable access to experienced attorneys without the uncertainty of expensive hourly legal fees.</p>\n              <p>Members receive legal consultation, document review, identity theft protection, and ongoing legal support designed to help individuals, families, entrepreneurs, and small businesses make confident decisions before problems become costly.</p>\n              <a class="sponsor-cta" href="/legal/">Explore LegalShield</a>\n            </article>'
          new, count = re.subn(r'<article class="card service sponsor-copy"[^>]*>[\s\S]*?</article>', service_card, text)
          if count and new != text:
              services.write_text(new, encoding='utf-8')
              changed.append('services.html')

          print('\n'.join(changed))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add series/*.html book/index.html services.html
          git commit -m "Canonicalize sponsor cards"
          git push
