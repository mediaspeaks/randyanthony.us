name: Finalize sponsor cards

on:
  push:
    branches:
      - sponsor-canonical-migration-3

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize remaining sponsor cards
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          mint = '''    <article class="sponsor-card">
      <img class="sponsor-logo" src="/assets/mint-mobile-referral.webp" alt="Mint Mobile">
      <h3>SPONSORED BY: Mint Mobile</h3>
      <p>
        Switch to Mint Mobile and stop overpaying for wireless service. <br> <br>If you're tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need.<br> <br>Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.
      </p>
      <a class="sponsor-cta" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a>
    </article>'''
          legal = '''    <article class="sponsor-card">
      <img class="sponsor-logo" src="/assets/LegalShield_logo.png" alt="LegalShield">
      <h3>SPONSORED BY: Legal Shield</h3>
      <p>
        Legal Shield &amp; ID Shield<br>
        Protecting Families &amp; Businesses Nationwide.
      </p>
      <a class="sponsor-cta" href="/legal/">Explore Plans →</a>
    </article>'''
          grid = '\n  <div class="sponsor-grid">\n\n' + legal + '\n\n' + mint + '\n\n  </div>\n'
          changed=[]
          for path in sorted(Path('series').glob('week*.html')):
              text=path.read_text(encoding='utf-8')
              if 'sponsor-grid' not in text: continue
              if 'sponsor-card' in text and 'SPONSORED BY: Mint Mobile' in text and 'Piety Paychain' not in text: continue
              new,count=re.subn(r'\n  <div class="sponsor-grid"[^>]*>.*?\n  </div>\n\n</main>',grid+'\n</main>',text,count=1,flags=re.S)
              if count:
                  if '/css/sponsors.css' not in new: new=new.replace('  <link rel="stylesheet" href="/css/public-nav.css">','  <link rel="stylesheet" href="/css/public-nav.css">\n  <link rel="stylesheet" href="/css/sponsors.css">',1)
                  path.write_text(new,encoding='utf-8'); changed.append(str(path))

          # Books: preserve the existing three-column .info-row. Sponsor cards become sponsor-card, but stay in that row.
          book=Path('book/index.html'); text=book.read_text(encoding='utf-8')
          def bs(m):
              b=m.group(0)
              if 'Mint Mobile' in b:
                  return '<article class="info-card sponsor-card"><img class="sponsor-logo" src="/assets/mint-mobile-referral.webp" alt="Mint Mobile"><h3>Sponsored by Mint Mobile</h3><p>Switch to Mint Mobile and stop overpaying for wireless service. <br> <br>If you\'re tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need.<br> <br>Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.</p><a class="sponsor-cta" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a></article>'
              if 'Sponsored by LegalShield' in b:
                  return '<article class="info-card sponsor-card"><img class="sponsor-logo" src="/assets/LegalShield_logo.png" alt="LegalShield"><h3>Sponsored by LegalShield</h3><p>Life is unpredictable. Legal questions aren\'t.</p><p>Whether you\'re protecting your family, growing a business, buying a home, reviewing a contract, or planning for the future, LegalShield provides affordable access to experienced attorneys without the uncertainty of expensive hourly legal fees.</p><p>Members receive legal consultation, document review, identity theft protection, and ongoing legal support designed to help individuals, families, entrepreneurs, and small businesses make confident decisions before problems become costly.</p><a class="sponsor-cta" href="/legal/">Explore LegalShield</a></article>'
              return b
          new,count=re.subn(r'<article class="info-card">(?:(?!</article>).)*?</article>',bs,text,flags=re.S)
          if count and new!=text:
              if '/css/sponsors.css' not in new: new=new.replace('<link rel="stylesheet" href="/css/public-nav.css">','<link rel="stylesheet" href="/css/public-nav.css">\n<link rel="stylesheet" href="/css/sponsors.css">',1)
              book.write_text(new,encoding='utf-8'); changed.append('book/index.html')

          # Services: preserve its existing two-column sponsor grid.
          services=Path('services.html'); text=services.read_text(encoding='utf-8')
          def ss(m):
              return '<article class="sponsor-card"><img class="sponsor-logo" src="/assets/mint-mobile-referral.webp" alt="Mint Mobile"><h3>Sponsored by Mint Mobile</h3><p>Switch to Mint Mobile and stop overpaying for wireless service. <br> <br>If you\'re tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need.<br> <br>Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.</p><a class="sponsor-cta" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a></article>' if 'Mint Mobile' in m.group(0) else '<article class="sponsor-card"><img class="sponsor-logo" src="/assets/LegalShield_logo.png" alt="LegalShield"><h3>Sponsored by LegalShield</h3><p>Life is unpredictable. Legal questions aren\'t.</p><p>Whether you\'re protecting your family, growing a business, buying a home, reviewing a contract, or planning for the future, LegalShield provides affordable access to experienced attorneys without the uncertainty of expensive hourly legal fees.</p><p>Members receive legal consultation, document review, identity theft protection, and ongoing legal support designed to help individuals, families, entrepreneurs, and small businesses make confident decisions before problems become costly.</p><a class="sponsor-cta" href="/legal/">Explore LegalShield</a></article>'
          new,count=re.subn(r'<article class="card service sponsor-copy"[^>]*>.*?</article>',ss,text,flags=re.S)
          if count and new!=text:
              if '/css/sponsors.css' not in new: new=new.replace('<link rel="stylesheet" href="/css/public-nav.css">','<link rel="stylesheet" href="/css/public-nav.css">\n<link rel="stylesheet" href="/css/sponsors.css">',1)
              services.write_text(new,encoding='utf-8'); changed.append('services.html')

          print('Changed:',*changed,sep='\n  ')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add series/*.html book/index.html services.html
          git commit -m "Canonicalize remaining sponsor cards"
          git push
