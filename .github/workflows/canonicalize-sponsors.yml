name: Finalize sponsor cards

on:
  push:
    branches:
      - sponsor-canonical-migration-3

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonicalize remaining sponsor cards
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/migrate.py
          python3 -m py_compile /tmp/migrate.py
          python3 /tmp/migrate.py
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add series/*.html book/index.html services.html
          git commit -m "Canonicalize remaining sponsor cards"
          git push
