name: Replace Piety Sponsor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-sponsor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Piety sponsor blocks
        shell: python
        run: |
          from pathlib import Path
          import re
          files = [Path('book/index.html'), Path('services.html')]
          files += sorted(Path('series').glob('week*.html'))
          replacement = '''<img src="/assets/mint-mobile-referral.webp" alt="Mint Mobile" style="display:block;width:220px;height:140px;object-fit:contain;margin:0 auto 24px;">\n<h3>SPONSORED BY: Mint Mobile</h3>\n<p style="color:#cbd5e1;">Switch to Mint Mobile and stop overpaying for wireless service every month. If you're tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need. Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.</p>\n<p style="margin-top:12px"><a class="btn" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a></p>'''
          changed = []
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              old = s
              # Replace only the Piety sponsor article, preserving the article's opening tag and closing tag.
              pattern = re.compile(r'(<article\\b[^>]*>)(.*?)(<\\/article>)', re.I | re.S)
              def repl(m):
                  body = m.group(2)
                  if not re.search(r'Piety\\s+Paychain|Piety\\s+PayChain', body, re.I):
                      return m.group(0)
                  opening = m.group(1)
                  opening = re.sub(r'aria-labelledby="[^"]*"', 'aria-labelledby="mint"', opening, flags=re.I)
                  return opening + '\n' + replacement + '\n' + m.group(3)
              s = pattern.sub(repl, s)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Changed:', '\n'.join(changed) if changed else 'none')
      - name: Commit replacements and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/replace-piety-sponsor.yml
          git add book/index.html services.html series/week*.html .github/workflows/replace-piety-sponsor.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Replace Piety sponsor with Mint Mobile"
          git push
