name: Replace Piety sponsor with Mint Mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-sponsor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace sponsor blocks
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          
          files = list(Path('series').glob('week*.html')) + [Path('book/index.html'), Path('services.html')]
          new_inner = '''\n  <!-- SPONSOR IMAGE -->\n  <img src="/assets/mint-mobile-referral.webp"\n       alt="Mint Mobile"\n       style="display:block;width:220px;height:140px;object-fit:contain;margin:0 auto 24px;">\n\n  <!-- SPONSOR NAME -->\n  <h3 id="mint">SPONSORED BY: Mint Mobile</h3>\n\n  <!-- SPONSOR COPY -->\n  <p style="color:#cbd5e1;">\n    Switch to Mint Mobile and stop overpaying for wireless service every month. If you're tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need. Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.\n  </p>\n\n  <!-- SPONSOR BUTTON -->\n  <p style="margin-top:12px;">\n    <a class="btn" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a>\n  </p>\n'''
          changed = []
          for p in files:
              s = p.read_text(encoding='utf-8')
              if '/assets/urme.png' not in s:
                  continue
              pat = re.compile(r'(<article\\b[^>]*>)(.*?)(</article>)', re.I | re.S)
              def repl(m):
                  if '/assets/urme.png' not in m.group(2):
                      return m.group(0)
                  opening = re.sub(r'aria-labelledby="[^"]+"', 'aria-labelledby="mint"', m.group(1), flags=re.I)
                  return opening + new_inner + m.group(3)
              ns, n = pat.subn(repl, s)
              if n:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(str(p))
          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit replacements and remove one-time workflow
        run: |
          rm -f .github/workflows/replace-piety-sponsor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/week*.html book/index.html services.html .github/workflows/replace-piety-sponsor.yml
          if git diff --cached --quiet; then
            echo "No sponsor replacements required."
            exit 0
          fi
          git commit -m "Replace Piety sponsor with Mint Mobile"
          git push
