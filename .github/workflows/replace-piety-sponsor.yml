name: Replace remaining Piety sponsor blocks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-sponsor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Piety sponsor blocks
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path('series').glob('week*.html')) + [Path('book/index.html'), Path('services.html')]
          new_inner = '''
            <!-- SPONSOR IMAGE -->
            <img src="/assets/mint-mobile-referral.webp"
                 alt="Mint Mobile"
                 style="display:block;width:220px;height:140px;object-fit:contain;margin:0 auto 24px;">

            <!-- SPONSOR NAME -->
            <h3 id="mint">SPONSORED BY: Mint Mobile</h3>

            <!-- SPONSOR COPY -->
            <p style="color:#cbd5e1;">
              Switch to Mint Mobile and stop overpaying for wireless service every month. If you're tired of watching your phone bill quietly eat away at your hard-earned money, Mint Mobile offers a simple way to cut that expense without giving up the wireless service you actually need. Use my referral link when you make the switch, and you’ll receive <strong>$15 in renewal credit</strong> as a little bonus for giving Mint a try.
            </p>

            <!-- SPONSOR BUTTON -->
            <p style="margin-top:12px;">
              <a class="btn" href="https://my.mintmobile.com/refer/Xmg4WaK">Get $15 Renewal Credit →</a>
            </p>
          '''
          changed = []
          pat = re.compile(r'(<article\\b[^>]*>)(.*?)(</article>)', re.I | re.S)
          for p in files:
              s = p.read_text(encoding='utf-8')
              if 'Piety Paychain' not in s and 'Piety PayChain' not in s:
                  continue
              def repl(m):
                  body = m.group(2)
                  if 'Piety Paychain' not in body and 'Piety PayChain' not in body:
                      return m.group(0)
                  opening = re.sub(r'aria-labelledby="[^"]+"', 'aria-labelledby="mint"', m.group(1), flags=re.I)
                  return opening + new_inner + m.group(3)
              ns, n = pat.subn(repl, s)
              if n:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(str(p))
          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit replacements and remove workflow
        run: |
          rm -f .github/workflows/replace-piety-sponsor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/week*.html book/index.html services.html .github/workflows/replace-piety-sponsor.yml
          if git diff --cached --quiet; then
            echo "No remaining Piety sponsor blocks found."
            exit 0
          fi
          git commit -m "Replace remaining Piety sponsors with Mint Mobile"
          git push
