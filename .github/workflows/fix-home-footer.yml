name: Fix Homepage Footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<footer class="site-foot">\n\n    <div>\n\n        © <span id="year"></span> Randy Anthony • Advisory • Operations • Strategy • All rights reserved.\n\n    </div>'''
          new = '''<footer class="site-foot">\n\n    <div>\n\n        © <span id="year"></span> | RANDI | Randy Anthony Network &amp; Digital Interface |\n\n    </div>'''
          if old not in s:
              raise SystemExit('Expected homepage footer text was not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage footer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update homepage RANDI footer"
          git push
