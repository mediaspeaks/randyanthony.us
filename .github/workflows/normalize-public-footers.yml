name: Normalize Public Footers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize active public footers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          excluded_parts = {"2026", "framework", "stream"}
          excluded_files = {"work.html", "ops.html", "index0.html", "new.html", "test.html", "index2.html", "part1.html", "part2.html", "soon.html", "templatemain.html"}
          roots = {"index.html", "home.html"}
          active_prefixes = ("book/", "radio/", "legal/", "series/week-")
          footer_text = "© <span id=\"year\"></span> | RANDI | Randy Anthony Network &amp; Digital Interface |"
          year_script = "<script>document.querySelectorAll('#year').forEach(el => el.textContent = new Date().getFullYear());</script>"

          changed = []
          for p in Path('.').rglob('*.html'):
              rel = p.as_posix()
              if any(part in excluded_parts for part in p.parts) or p.name in excluded_files:
                  continue
              if not (rel in roots or rel.startswith(active_prefixes)):
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'©\s*(?:<span[^>]*id=["\']year["\'][^>]*>.*?</span>|\d{4})\s+Randy Anthony\s+•\s+Advisory\s+•\s+Operations\s+•\s+Strategy\s+•\s+All rights reserved\.', footer_text, text, flags=re.I|re.S)
              text = re.sub(r'(<div[^>]*class=["\']smallLinks["\'][^>]*>\s*<a[^>]*>)Home Page(</a>)', r'\1Home\2', text, flags=re.I)
              if text != original and 'id="year"' in text and "new Date().getFullYear()" not in text:
                  text = re.sub(r'</body>', year_script + '\n</body>', text, count=1, flags=re.I)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(rel)
          print(f"Changed {len(changed)} active public pages")
          for path in changed:
              print(path)
          PY
      - name: Commit footer normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize public site footers"
          git push
