name: AdSense P1 remediation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !startsWith(github.event.head_commit.message, 'AdSense P1 bulk remediation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update series metadata, schema, and internal links
        shell: python
        run: |
          import html
          import json
          import pathlib
          import re

          root = pathlib.Path('series')
          pages = sorted(root.glob('week*.html'))
          existing = {p.name for p in pages}

          def clean(text):
              text = re.sub(r'<[^>]+>', ' ', text)
              text = html.unescape(text)
              return re.sub(r'\s+', ' ', text).strip()

          changed = []
          broken = []
          for path in pages:
              if path.name in {'week-01-reliability.html', 'week-02-invisible-work.html'} or path.name.lower().startswith('week14'):
                  continue
              s = path.read_text(encoding='utf-8')
              m = re.search(r'<h1[^>]*class=["\']hero-title["\'][^>]*>(.*?)</h1>', s, re.S | re.I)
              if not m:
                  continue
              headline = clean(m.group(1))
              title = f'{headline} | Randy Anthony'
              pm = re.search(r'<section class=["\']card body split-post["\'][\s\S]*?<div class=["\']post-text["\']>([\s\S]*?)</div>', s, re.I)
              first = ''
              if pm:
                  ps = re.findall(r'<p[^>]*>(.*?)</p>', pm.group(1), re.S | re.I)
                  if ps:
                      first = clean(ps[0])
              if not first:
                  first = headline
              desc = (first + " Explore Randy Anthony's Operational Visibility Series and its practical lessons for reliable, time-critical operations.")
              desc = desc[:158].rstrip(' ,.;:') + '.'
              canonical = f'https://randyanthony.us/series/{path.name}'

              s = re.sub(r'<title>.*?</title>', f'<title>{html.escape(title)}</title>', s, count=1, flags=re.S|re.I)
              s = re.sub(r'<meta name=["\']description["\'] content=["\'][^"\']*["\']\s*/?>', f'<meta name="description" content="{html.escape(desc, quote=True)}">', s, count=1, flags=re.I)
              s = re.sub(r'<meta property=["\']og:type["\'] content=["\'][^"\']*["\']\s*/?>', '<meta property="og:type" content="article">', s, count=1, flags=re.I)
              s = re.sub(r'<meta property=["\']og:title["\'] content=["\'][^"\']*["\']\s*/?>', f'<meta property="og:title" content="{html.escape(title, quote=True)}">', s, count=1, flags=re.I)
              s = re.sub(r'<meta property=["\']og:description["\'] content=["\'][^"\']*["\']\s*/?>', f'<meta property="og:description" content="{html.escape(desc, quote=True)}">', s, count=1, flags=re.I)
              s = re.sub(r'<meta property=["\']og:url["\'] content=["\'][^"\']*["\']\s*/?>', f'<meta property="og:url" content="{canonical}">', s, count=1, flags=re.I)

              if '"@type": "BlogPosting"' not in s:
                  obj = {
                      '@context': 'https://schema.org',
                      '@type': 'BlogPosting',
                      'headline': headline,
                      'description': desc,
                      'author': {'@type': 'Person', 'name': 'Randy Anthony', 'url': 'https://randyanthony.us/bio/'},
                      'publisher': {'@type': 'Person', 'name': 'Randy Anthony', 'url': 'https://randyanthony.us/'},
                      'mainEntityOfPage': {'@type': 'WebPage', '@id': canonical},
                      'image': 'https://randyanthony.us/og.png',
                      'isPartOf': {'@type': 'CreativeWorkSeries', 'name': 'Operational Visibility Series', 'url': 'https://randyanthony.us/series/'}
                  }
                  schema = '<script type="application/ld+json">\n' + json.dumps(obj, indent=2, ensure_ascii=False) + '\n</script>\n'
                  s = s.replace('</head>', schema + '</head>', 1)

              def link_fix(match):
                  href = match.group(1)
                  if not href.startswith('/series/') or not href.endswith('.html'):
                      return match.group(0)
                  target = href.rsplit('/', 1)[-1]
                  if target in existing:
                      return match.group(0)
                  norm = target.replace('week-', 'week', 1)
                  if norm in existing:
                      return match.group(0).replace(target, norm)
                  broken.append((path.name, href))
                  return match.group(0)
              s = re.sub(r'href=["\']([^"\']+)["\']', link_fix, s, flags=re.I)

              path.write_text(s, encoding='utf-8')
              changed.append(path.name)

          print(f'Updated {len(changed)} series pages: {changed}')
          if broken:
              print('Unresolved local series links:', broken)
          else:
              print('No unresolved local series links found.')

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "AdSense P1 bulk remediation"
            git push
          fi
