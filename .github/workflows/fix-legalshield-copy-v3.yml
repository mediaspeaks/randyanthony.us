name: Fix LegalShield copy v3

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Restore full copy on Weeks 19-27
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
            'series/week19-compressed-decision-windows.html',
            'series/week20-operational-drift.html',
            'series/week21-false-recovery.html',
            'series/week22-control-surface-vs-system-state.html',
            'series/week23-signal-prioritization.html',
            'series/week24-interface-fragility.html',
            'series/week25-recovery-architecture.html',
            'series/week26-decision-load-under-pressure.html',
            'series/week27-operational-visibility-synthesis.html',
          ]

          canonical = '''<img class="sponsor-logo" src="/assets/LegalShield_logo.png" alt="LegalShield">
          <h3>Sponsored by LegalShield</h3>
          <p>Life is unpredictable. Legal questions aren't.</p>
          <p>Whether you're protecting your family, growing a business, buying a home, reviewing a contract, or planning for the future, LegalShield provides affordable access to experienced attorneys without the uncertainty of expensive hourly legal fees.</p>
          <p>Members receive legal consultation, document review, identity theft protection, and ongoing legal support designed to help individuals, families, entrepreneurs, and small businesses make confident decisions before problems become costly.</p>
          <a class="sponsor-cta" href="/legal/">Explore Plans →</a>'''

          pattern = re.compile(r'<article[^>]*>\s*<img[^>]*LegalShield_logo\.png[^>]*>.*?</article>', re.I | re.S)
          changed = []
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(lambda m: re.match(r'<article[^>]*>', m.group(0), re.I).group(0) + '\n' + canonical + '\n  </article>', text)
              print(name, 'matches=', count)
              if count != 1:
                  raise SystemExit(f'Expected exactly one LegalShield sponsor card in {name}, found {count}')
              path.write_text(new_text, encoding='utf-8')
              changed.append(name)
          print('Changed', len(changed), 'files')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/week19-*.html series/week20-*.html series/week21-*.html series/week22-*.html series/week23-*.html series/week24-*.html series/week25-*.html series/week26-*.html series/week27-*.html
          git commit -m "Restore full LegalShield sponsor copy on Weeks 19-27"
          git push origin HEAD:${{ github.head_ref }}