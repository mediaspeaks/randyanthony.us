name: Restore LegalShield copy on Weeks 7-18

on:
  push:
    branches:
      - legalshield-weeks-07-18

permissions:
  contents: write

jobs:
  restore-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full LegalShield sponsor copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old = '''<p>
        Legal Shield &amp; ID Shield<br>
        Protecting Families &amp; Businesses Nationwide.
      </p>'''

          new = '''<p>
        Life is unpredictable. Legal questions aren't.
      </p>
      <p>
        Whether you're protecting your family, growing a business, buying a home, reviewing a contract, or planning for the future, LegalShield provides affordable access to experienced attorneys without the uncertainty of expensive hourly legal fees.
      </p>
      <p>
        Members receive legal consultation, document review, identity theft protection, and ongoing legal support designed to help individuals, families, entrepreneurs, and small businesses make confident decisions before problems become costly.
      </p>'''

          files = []
          for path in Path('series').glob('week*.html'):
              match = re.search(r'week-?(\d+)', path.name)
              if match and 7 <= int(match.group(1)) <= 18:
                  files.append(path)

          if len(files) != 12:
              raise SystemExit(f'Expected 12 weekly files for Weeks 7-18, found {len(files)}')

          total = 0
          for path in sorted(files):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one truncated LegalShield copy block in {path}, found {count}')
              path.write_text(text.replace(old, new, 1))
              total += count

          if total != 12:
              raise SystemExit(f'Expected 12 repairs, made {total}')
          PY

      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/week*.html
          git commit -m "Restore full LegalShield copy on Weeks 7-18"
          git push