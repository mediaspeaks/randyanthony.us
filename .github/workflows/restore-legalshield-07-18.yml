name: Restore LegalShield copy on Weeks 7-18

on:
  push:
    branches:
      - legalshield-weeks-07-18

permissions:
  contents: write

jobs:
  restore-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full LegalShield sponsor copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          full = '''<p>
              Life is unpredictable. Legal questions aren't.
            </p>
            <p>
              Whether you're protecting your family, growing a business, buying a home, reviewing a contract, or planning for the future, LegalShield provides affordable access to experienced attorneys without the uncertainty of expensive hourly legal fees.
            </p>
            <p>
              Members receive legal consultation, document review, identity theft protection, and ongoing legal support designed to help individuals, families, entrepreneurs, and small businesses make confident decisions before problems become costly.
            </p>'''

          files = []
          for path in Path('series').glob('week*.html'):
              match = re.search(r'week-?(\d+)', path.name)
              if match and 7 <= int(match.group(1)) <= 18:
                  files.append(path)

          if len(files) != 12:
              raise SystemExit(f'Expected 12 weekly files for Weeks 7-18, found {len(files)}')

          repaired = 0
          already_ok = 0
          for path in sorted(files):
              text = path.read_text()
              pattern = r'(<img\s+class="sponsor-logo"\s+src="/assets/LegalShield_logo\.png"\s+alt="LegalShield">\s*<h3[^>]*>.*?</h3>\s*)(.*?)(\s*<a\s+class="sponsor-cta")'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise SystemExit(f'Could not locate LegalShield sponsor content in {path}')
              body = match.group(2)
              if 'Life is unpredictable. Legal questions aren\'t.' in body and 'Members receive legal consultation' in body:
                  already_ok += 1
                  continue
              new = text[:match.start(2)] + full + text[match.end(2):]
              path.write_text(new)
              repaired += 1

          print(f'Repaired {repaired} pages; {already_ok} were already correct.')
          if repaired != 12 and already_ok != 12:
              raise SystemExit(f'Expected all 12 pages to be repaired or already correct; repaired={repaired}, already_ok={already_ok}')
          PY

      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/week*.html
          if git diff --cached --quiet; then
            echo "No page changes needed."
            exit 0
          fi
          git commit -m "Restore full LegalShield copy on Weeks 7-18"
          git push