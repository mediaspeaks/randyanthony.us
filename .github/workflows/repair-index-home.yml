name: Repair Main Home Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Repair main home navigation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair index navigation
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          HEADER = '''<header class="site-header">
            <a href="/" class="brand">
              <img src="/favicon.png" alt="Randy Anthony">
              <div>
                <strong>RANDY ANTHONY</strong>
                <span>Operational Reliability Advisory</span>
              </div>
            </a>
            <nav class="primary" aria-label="Primary Navigation">
              <a href="/">Home</a>
              <a href="/series/">Operational Visibility Series</a>
              <a href="/home.html">Services</a>
              <a href="/book/">Books</a>
              <a href="/radio/">Radio</a>
              <a class="header-cta" href="mailto:inbox@randyanthony.us?subject=Consultation%20request">Request a Consultation</a>
            </nav>
            <button class="mobile-toggle" id="mobileToggle" aria-expanded="false" aria-controls="mobileNav" aria-label="Open navigation menu">☰</button>
          </header>
          <nav id="mobileNav" class="mobile-nav" aria-hidden="true">
            <a href="/">Home</a>
            <a href="/series/">Operational Visibility Series</a>
            <a href="/home.html">Services</a>
            <a href="/book/">Books</a>
            <a href="/radio/">Radio</a>
            <a class="header-cta" href="mailto:inbox@randyanthony.us?subject=Consultation%20request">Request a Consultation</a>
          </nav>'''
          if '<header class="site-header">' not in text:
              marker = '<div class="site" role="document">'
              if marker not in text:
                  raise SystemExit('Expected homepage container not found')
              text = text.replace(marker, HEADER + '\n\n' + marker, 1)
          if 'const mobileToggle = document.getElementById("mobileToggle");' not in text:
              script = '''<script>
          const mobileToggle = document.getElementById("mobileToggle");
          const mobileNav = document.getElementById("mobileNav");
          if (mobileToggle && mobileNav) {
              mobileToggle.addEventListener("click", function () {
                  const open = mobileNav.classList.toggle("show");
                  mobileToggle.setAttribute("aria-expanded", open);
                  mobileNav.setAttribute("aria-hidden", !open);
              });
          }
          </script>'''
              text = text.replace('</body>', script + '\n\n</body>', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair main home navigation"
          git push
