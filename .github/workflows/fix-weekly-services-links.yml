name: Fix weekly Services links

on:
  push:
    paths:
      - '.github/workflows/fix-weekly-services-links.yml'

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace stale Services links
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('series').glob('week*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('href="/home.html">Services', 'href="/services.html">Services')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Updated {path}')
          PY

      - name: Commit weekly link fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add series/week*.html
          if git diff --cached --quiet; then
            echo 'No stale weekly Services links found.'
          else
            git commit -m 'Fix Services links across weekly series pages'
            git push
          fi
