<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover Shift AI through Randy Anthony. Watch the introduction and explore the platform.">
  <meta name="author" content="Randy Anthony">
  <meta name="theme-color" content="#071a33">
  <link rel="canonical" href="https://randyanthony.us/2026">
  <title>Shift AI | Randy Anthony</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Shift AI | Randy Anthony">
  <meta property="og:description" content="Watch the introduction and explore Shift AI.">
  <meta property="og:url" content="https://randyanthony.us/2026">
</head>
<body>
  <main class="page">
    <div class="brand">RANDI <span>|</span> Randy Anthony</div>
    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">A Different Way to Create</h1>
      <p class="intro">Watch the short introduction, then explore Shift AI.</p>

      <video class="intro-video" controls playsinline preload="metadata">
        <source src="/2026/avatarvideo.mp4" type="video/mp4">
        Your browser does not support embedded video. You can still visit Shift AI using the button below.
      </video>

      <a class="cta" href="https://go.shiftai.club/randy-l-anthony" target="_blank" rel="noopener noreferrer">GET SHIFT AI</a>
    </section>
    <footer>Randy Anthony Network &amp; Digital Interface</footer>
  </main>

  <style>
    :root {
      color-scheme: dark;
      --navy: #071a33;
      --panel: #0d2748;
      --blue: #2f80ed;
      --text: #f5f7fb;
      --muted: #b8c6d9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #12365c 0%, var(--navy) 58%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(100% - 32px, 900px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .brand {
      padding: 26px 0 18px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand span { color: var(--blue); padding: 0 7px; }

    .content {
      width: 100%;
      margin: auto 0;
      padding: 24px 0 40px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.12;
      letter-spacing: -.03em;
    }

    .intro {
      margin: 0 auto 26px;
      color: var(--muted);
      font-size: clamp(16px, 2.3vw, 19px);
      line-height: 1.5;
    }

    .intro-video {
      display: block;
      width: min(100%, 405px);
      max-height: 72vh;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      margin: 0 auto 26px;
      background: #000;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.32);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 32px;
      border-radius: 7px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .07em;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }

    .cta:hover { background: #1768d0; transform: translateY(-1px); }
    .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    footer {
      padding: 22px 0 26px;
      color: #8fa5bf;
      text-align: center;
      font-size: 12px;
      letter-spacing: .04em;
    }

    @media (max-width: 480px) {
      .page { width: min(100% - 24px, 900px); }
      .brand { padding-top: 20px; }
      .intro-video { width: min(100%, 360px); }
      .cta { width: min(100%, 360px); }
    }
  </style>
</body>
</html>
